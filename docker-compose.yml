services:
  weapon-paints:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "80"
    volumes:
      - weapon_paints_storage:/var/www/html/api/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/', false, stream_context_create(['http' => ['header' => \"X-Forwarded-Proto: https\\r\\n\"]])) === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      weapon-paints:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-skins.northstar.cool}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  weapon_paints_storage:
  caddy_data:
  caddy_config:
